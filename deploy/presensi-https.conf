# =========================================================
# NGINX — PRESENSI NON-ASN LEWAT HTTPS
# =========================================================
#
# Alamat: https://presensi.rokeubmn.id
#
# KENAPA HARUS HTTPS
#
# Browser hanya mengizinkan GPS (navigator.geolocation) di
# "secure context" — HTTPS atau localhost. Di http:// biasa,
# permintaan lokasi ditolak SEBELUM sistem operasi ditanya,
# dengan kode PERMISSION_DENIED yang sama persis seperti saat
# pengguna menolak izin. Karena itu tidak pernah muncul
# permintaan izin apa pun, dan semua setelan GPS di HP tampak
# benar tapi tidak pernah terpakai.
#
# Aturan yang sama mengunci kamera (getUserMedia). Halaman
# absensi selamat hanya karena punya cadangan
# <input type="file" capture>; lokasi tidak punya cadangan.
#
# IP lokal TIDAK dikecualikan. Yang dikecualikan hanya
# localhost, karena datanya tidak pernah keluar dari
# perangkat itu sendiri.
#
# =========================================================
# PRASYARAT
# =========================================================
#
# 1. DNS: A record  presensi.rokeubmn.id -> 192.168.221.44
#
#    Menunjuk IP privat dari DNS publik itu sah dan justru
#    sesuai: alamatnya hanya bisa dibuka dari dalam jaringan
#    kantor, persis seperti sekarang.
#
# 2. Sertifikat Let's Encrypt lewat DNS-01.
#
#    HTTP-01 (cara biasa) menuntut server terjangkau dari
#    internet di port 80. Server ini hanya hidup di LAN, jadi
#    tidak bisa. DNS-01 membuktikan kepemilikan lewat record
#    TXT, tanpa server perlu terjangkau sama sekali.
#
#    Cara cepat (sekali jalan, perpanjangan manual):
#
#      sudo certbot certonly --manual \
#           --preferred-challenges dns \
#           -d presensi.rokeubmn.id
#
#    Certbot akan meminta dibuatkan record TXT bernama
#    _acme-challenge.presensi.rokeubmn.id. Tambahkan di panel
#    DNS, tunggu sampai tersebar, lalu tekan Enter.
#
#    PERHATIAN: cara --manual TIDAK BISA diperpanjang
#    otomatis. Sertifikat Let's Encrypt berlaku 90 hari, jadi
#    tiap 3 bulan langkah ini harus diulang — dan kalau
#    terlewat, seluruh absensi web mati sampai diperbarui.
#
#    Cara yang benar untuk jangka panjang: pakai plugin DNS
#    sesuai penyedia domainnya, misalnya
#
#      sudo certbot certonly \
#           --dns-cloudflare \
#           --dns-cloudflare-credentials /etc/letsencrypt/dns.ini \
#           -d presensi.rokeubmn.id
#
#    dengan itu `certbot renew` berjalan sendiri lewat timer
#    systemd bawaan, dan tidak ada yang perlu diingat.
#
# =========================================================
# CARA PASANG
# =========================================================
#
#   sudo cp deploy/presensi-https.conf \
#           /etc/nginx/sites-available/presensi-https
#   sudo ln -s /etc/nginx/sites-available/presensi-https \
#              /etc/nginx/sites-enabled/presensi-https
#   sudo nginx -t                     # WAJIB diuji dulu
#   sudo systemctl reload nginx
#
# Kalau ufw aktif: sudo ufw allow 443/tcp
#
# SESUDAHNYA, JANGAN LUPA:
#
#   PUBLIC_BASE_URL di .env backend harus ikut berubah ke
#   https://presensi.rokeubmn.id — nilai itu dipakai membuat
#   tautan foto di berkas rekap Excel. Kalau tertinggal di
#   http://192.168.221.44:8001, tautannya tetap jalan tapi
#   memaksa petugas kembali ke halaman tidak aman.

# ---------------------------------------------------------
# 1. HTTP LAMA -> HTTPS
# ---------------------------------------------------------
#
# Port 8001 dipertahankan, tidak dimatikan: pegawai sudah
# terlanjur menyimpan alamat lama, dan blok ini mengantar
# mereka ke alamat baru alih-alih memberi halaman mati.

server {
    listen 8001;
    listen [::]:8001;

    server_name _;

    return 301 https://presensi.rokeubmn.id$request_uri;
}

# ---------------------------------------------------------
# 2. HTTPS
# ---------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name presensi.rokeubmn.id;

    ssl_certificate     /etc/letsencrypt/live/presensi.rokeubmn.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presensi.rokeubmn.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sekali HTTPS terbukti jalan, baris ini memaksa browser
    # mengingat untuk tidak pernah memakai http:// lagi.
    #
    # BARU AKTIFKAN SETELAH YAKIN: selama masa berlakunya,
    # browser menolak http:// untuk nama ini walaupun
    # sertifikatnya bermasalah, dan itu tidak bisa dibatalkan
    # dari sisi server.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /home/support/apps/presensi-non-asn/presensi-biro-keuangan-dan-bmn-frontend/dist;
    index index.html;

    # Foto absensi dikirim sebagai data URL base64. Backend
    # membatasi 10 MB per foto — sekitar 13,4 MB setelah
    # base64 — sedangkan default nginx hanya 1 MB.
    client_max_body_size 20m;

    access_log /var/log/nginx/presensi-https.access.log;
    error_log  /var/log/nginx/presensi-https.error.log;

    # -----------------------------------------------------
    # API
    # -----------------------------------------------------
    #
    # proxy_pass tanpa path dan tanpa trailing slash, supaya
    # URI asli diteruskan utuh ke Express.

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # -----------------------------------------------------
    # FOTO ABSENSI
    # -----------------------------------------------------

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------
    # ASET BUILD
    # -----------------------------------------------------

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # -----------------------------------------------------
    # SPA FALLBACK
    # -----------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
