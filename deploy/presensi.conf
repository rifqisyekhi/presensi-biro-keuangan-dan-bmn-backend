# =========================================================
# NGINX — PRESENSI NON-ASN BIRO KEUANGAN DAN BMN
# =========================================================
#
# Pasang di /etc/nginx/sites-available/presensi.conf lalu
# symlink ke sites-enabled. Lihat deploy/README.md.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Hasil "npm run build" frontend disalin ke sini.
    root /var/www/presensi;
    index index.html;

    # Foto absensi dikirim sebagai data URL base64. Backend
    # menerima sampai 10 MB per foto (≈14 MB setelah base64)
    # dan body parser-nya diset 50 MB, jadi batas nginx harus
    # ikut dinaikkan — default 1 MB akan menolaknya dengan 413.
    client_max_body_size 50m;

    access_log /var/log/nginx/presensi.access.log;
    error_log  /var/log/nginx/presensi.error.log;

    # -----------------------------------------------------
    # API
    # -----------------------------------------------------
    #
    # proxy_pass TANPA trailing slash dan TANPA path, supaya
    # URI asli diteruskan apa adanya: /api/absensi/clock-in
    # sampai ke Express sebagai /api/absensi/clock-in.
    #
    # Kalau ditulis "http://127.0.0.1:5000/" (pakai slash),
    # nginx memotong prefix /api dan Express membalas 404 —
    # persis gejala yang ada di server sekarang.

    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Unggah foto bisa lambat di jaringan kantor.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Body diteruskan streaming, tidak ditahan dulu di disk.
        proxy_request_buffering off;
    }

    # -----------------------------------------------------
    # FOTO ABSENSI
    # -----------------------------------------------------
    #
    # Diteruskan ke Express (express.static di index.js) supaya
    # nginx tidak perlu tahu di mana UPLOAD_DIR berada. Kalau
    # nanti mau dilayani nginx langsung demi kecepatan, ganti
    # blok ini — lihat catatan di deploy/README.md.

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------
    # ASET BUILD
    # -----------------------------------------------------

    # Nama berkas Vite sudah ber-hash (index-BnmzuJu2.js), jadi
    # aman di-cache selamanya. Build baru = nama baru.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html TIDAK boleh di-cache, kalau tidak pengguna
    # tetap memuat aset versi lama setelah deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # -----------------------------------------------------
    # SPA FALLBACK
    # -----------------------------------------------------
    #
    # Harus paling akhir. Route React (/attendance, /history)
    # tidak ada berkasnya di disk, jadi dikembalikan index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
