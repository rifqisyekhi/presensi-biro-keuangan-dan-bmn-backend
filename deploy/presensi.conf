# =========================================================
# NGINX — PRESENSI NON-ASN
# =========================================================
#
# Alamat: http://192.168.221.44:8001
#
# Aplikasi ini internal dan belum punya nama domain, jadi
# pembedanya nomor port, bukan server_name. Nginx yang
# mendengarkan di 8001 — bukan Node — karena frontend-nya
# berupa berkas statis di dist/ dan tidak ada proses Node yang
# menyajikannya. Port 5000 milik backend tetap di belakang,
# tidak perlu diketahui pengguna.
#
# CARA PASANG (di VPS):
#   sudo cp deploy/presensi.conf /etc/nginx/sites-available/presensi-8001
#   sudo ln -s /etc/nginx/sites-available/presensi-8001 \
#              /etc/nginx/sites-enabled/presensi-8001
#   sudo nginx -t                      # WAJIB diuji dulu
#   sudo systemctl reload nginx
#
# Kalau ufw aktif: sudo ufw allow 8001/tcp
#
# CATATAN — blok lama untuk presensi.rokeubmn.id boleh tetap
# ada; nama itu tidak ter-resolve sehingga tidak pernah
# terpakai. Hapus saja setelah alamat 8001 terbukti jalan.

server {
    listen 8001;
    listen [::]:8001;

    # Satu-satunya blok di port ini, jadi semua nama host
    # yang masuk lewat 8001 dilayani di sini.
    server_name _;

    root /home/support/apps/presensi-non-asn/presensi-biro-keuangan-dan-bmn-frontend/dist;
    index index.html;

    # Foto absensi dikirim sebagai data URL base64. Backend
    # membatasi 10 MB per foto — sekitar 13,4 MB setelah
    # base64 — sedangkan default nginx hanya 1 MB dan akan
    # menolaknya dengan 413. Angka 20m menyamai blok presensi
    # yang sudah berjalan.
    client_max_body_size 20m;

    access_log /var/log/nginx/presensi-8001.access.log;
    error_log  /var/log/nginx/presensi-8001.error.log;

    # -----------------------------------------------------
    # API
    # -----------------------------------------------------
    #
    # proxy_pass tanpa path dan tanpa trailing slash, supaya
    # URI asli diteruskan utuh: /api/absensi/clock-in sampai
    # ke Express apa adanya. Menambahkan "/" di ujung akan
    # memotong prefix /api dan Express membalas 404.

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Unggah foto dan pembuatan berkas rekap Excel bisa
        # lambat; jangan diputus nginx lebih dulu dengan 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # -----------------------------------------------------
    # FOTO ABSENSI
    # -----------------------------------------------------
    #
    # Diteruskan ke Express (express.static) supaya nginx
    # tidak perlu tahu letak UPLOAD_DIR, dan foto yang
    # berkasnya hilang tetap menghasilkan 404 yang jujur.

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------
    # ASET BUILD
    # -----------------------------------------------------

    # Nama berkas Vite sudah ber-hash, jadi aman di-cache
    # lama. Build baru menghasilkan nama baru.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache, kalau tidak pegawai
    # tetap memuat aset versi lama setelah deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # -----------------------------------------------------
    # SPA FALLBACK
    # -----------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
